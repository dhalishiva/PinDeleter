name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: jghyecyaazwbsdtgqsva
    steps:
      - uses: actions/checkout@v5

      - name: Check access token
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN repo secret is not set — skipping deploy. Add it in Settings → Secrets and variables → Actions, then re-run this workflow."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 3.1.0

      - name: Deploy all functions
        if: steps.guard.outputs.skip != 'true'
        run: supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --use-api --yes
